name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,mcp]"
      - run: ruff check .
      - run: pytest -q

  kicad-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/inti-cmnb/kicad9_auto:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: pip install --break-system-packages "numpy>=1.26" "shapely>=2.0"
      - name: Run pipeline on example board
        run: |
          python -m amproute_studio.cli run examples/amplifier.kicad_pcb -o examples/amplifier_out.kicad_pcb
          kicad-cli pcb drc --severity-error --exit-code-violations examples/amplifier_out.kicad_pcb
      - name: Generate gerbers
        run: |
          kicad-cli pcb export gerbers --output gerber_out/ examples/amplifier_out.kicad_pcb
          (cd gerber_out && zip -r ../gerbers.zip .)
      - name: Upload gerber archive
        uses: actions/upload-artifact@v4
        with:
          name: gerbers
          path: gerbers.zip
