name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: clippy (-D warnings)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  build:
    name: cargo build --release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --bins

  smoke-two-layer:
    name: two-layer route smoke
    runs-on: windows-latest
    needs: [build, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --bins
      - name: Route lm386-mini --two-layer
        shell: pwsh
        run: |
          $o = Join-Path $env:TEMP amproute_ci_2l
          New-Item -ItemType Directory -Force -Path $o | Out-Null
          $p = & target/release/amproute-studio.exe --cli --board lm386-mini --two-layer -o $o --json 2>$null
          if ($LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }
          $r = ($p | Out-String | ConvertFrom-Json)
          if ($r.ok -ne $true) { throw "ok = $($r.ok)" }
