name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      - name: Build release binary
        run: cargo build --release

      - name: Smoke-test headless export
        run: |
          .\target\release\amproute-studio.exe --cli --output ci-output
          if (-not (Test-Path ci-output\board.gbr)) { throw "Gerber was not produced" }
          if (-not (Test-Path ci-output\lut_print.pdf)) { throw "LUT template was not produced" }
          Get-ChildItem ci-output | Format-Table Name, Length

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: amproute-studio-windows-x86_64
          path: target/release/amproute-studio.exe
          if-no-files-found: error
