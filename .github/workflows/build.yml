name: Build PyO3 Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin

      - name: Build extension
        run: maturin build --release --manifest-path amproute_core/Cargo.toml --out dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: amproute-core-wheel
          path: dist/*.whl

  test:
    needs: build
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: amproute-core-wheel
          path: dist

      - name: Install and test
        run: |
          pip install dist/*.whl --force-reinstall
          python -c "import amproute_core; print('Rust module loaded:', amproute_core.__file__)"
