name: Build PyO3 Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Python extension
        run: |
          pip install maturin
          maturin build --release --manifest-path amproute_core/Cargo.toml --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: windows-wheels
          path: dist/*.whl

  build-macos:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Python extension
        run: |
          pip install maturin
          maturin build --release --manifest-path amproute_core/Cargo.toml --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: macos-wheels
          path: dist/*.whl

  build-linux:
    runs-on: ubuntu-latest
    container: ghcr.io/pypa/manylinux2014:x86_64
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Python extension
        run: |
          pip install maturin
          maturin build --release --manifest-path amproute_core/Cargo.toml --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: linux-wheels
          path: dist/*.whl

  test-windows:
    needs: build-windows
    runs-on: windows-latest
    python-version: '3.12'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: windows-wheels
          path: dist

      - name: Install and test
        run: |
          pip install dist/*.whl --force-reinstall
          python -c "import amproute_core; print('Rust module loaded:', amproute_core.__file__)"

  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-wheels
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
