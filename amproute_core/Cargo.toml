[package]
name = "amproute_core"
version = "0.1.0"
edition = "2021"
description = "High-performance autorouter core for AmpRoute Studio"
license = "MIT"

[lib]
name = "amproute_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
