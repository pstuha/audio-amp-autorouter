[package]
name = "amproute_core"
version = "0.1.0"
edition = "2021"
description = "High-performance autorouter core for AmpRoute Studio"
license = "MIT"

[lib]
name = "amproute_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
rayon = "1.10"  # Parallel iteration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
priority-queue = "2.1"
ndarray = { version = "0.16", features = ["rayon"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
