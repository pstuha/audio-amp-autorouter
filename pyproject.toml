[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amproute-studio"
version = "0.1.0"
description = "AmpRoute Studio — автотрассировщик и симулятор для однослойных и двухсторонних плат УНЧ (ЛУТ)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AmpRoute Studio contributors" }]
keywords = ["pcb", "autorouter", "audio-amplifier", "lut", "toner-transfer", "kicad", "eda", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "shapely>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
sim = ["matplotlib>=3.7"]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "ruff>=0.6", "pyinstaller>=6.0"]
mcp = ["mcp>=1.0,<2"]
all = ["PySide6>=6.6", "matplotlib>=3.7", "mcp>=1.0,<2", "pytest>=8.0", "pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/pstuha/amproute-studio"
Repository = "https://github.com/pstuha/amproute-studio"
Issues = "https://github.com/pstuha/amproute-studio/issues"
Documentation = "https://github.com/pstuha/amproute-studio/tree/main/docs"

[project.scripts]
amprote = "amproute_studio.cli:main"
amprote-studio = "amproute_studio.gui.app:run"

[tool.setuptools.packages.find]
include = ["amproute_studio*"]

[tool.ruff]
target-version = "py311"
line-length = 140

[tool.ruff.lint]
select = ["F", "E", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
