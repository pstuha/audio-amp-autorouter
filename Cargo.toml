[package]
name = "amproute-studio"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Autorouter and 2D board viewer for single-layer THT audio amplifier PCBs made with the LUT (toner-transfer) method"
authors = ["Pavel Stuha <pstuha@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/pstuha/audio-amp-autorouter"
homepage = "https://github.com/pstuha/audio-amp-autorouter"
documentation = "https://github.com/pstuha/audio-amp-autorouter/blob/main/README.md"
keywords = ["pcb", "autorouter", "audio", "amplifier", "lut"]
categories = ["command-line-utilities", "graphics"]
readme = "README.md"

[lib]
name = "amproute_studio"
path = "src/lib.rs"

[[bin]]
name = "amproute-studio"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }
# GUI
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
# Export
printpdf = "0.7"
# Serialization of board projects
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Errors
anyhow = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
