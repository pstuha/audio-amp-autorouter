[package]
name = "amproute-studio"
version = "2.2.0"
edition = "2021"
rust-version = "1.88"
description = "Agent-first autorouter and 2D board editor for LUT audio amplifier PCBs: KiCad DRC, Gerber/IPC-2581/ODB++, MCP"
authors = ["Pavel Stuha <pstuha@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/pstuha/audio-amp-autorouter"
documentation = "https://github.com/pstuha/audio-amp-autorouter/blob/main/README.md"
keywords = ["pcb", "autorouter", "audio", "amplifier", "lut", "mcp", "kicad"]
categories = ["command-line-utilities", "graphics"]
readme = "README.md"

[lib]
name = "amproute_studio"
path = "src/lib.rs"

[[bin]]
name = "amproute-studio"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "cargo"] }
# GUI
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
# Export
printpdf = "0.7"
# Serialization of board projects
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Errors
anyhow = "1.0"
# File dialogs in GUI
rfd = "0.14"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
